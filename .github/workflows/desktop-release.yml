name: Desktop Client

# 桌面客户端的构建与发布。和 Web 的 Docker 镜像（publish.yml）是两个独立的
# workflow run —— 同一个 tag 会各自触发一次，任一边失败都不影响另一边的产物。
#
#   push main      -> 三平台跑类型检查和测试，不打包（打包一次约 7 分钟 × 3，
#                     而 macOS runner 计费是 Linux 的 10 倍；Next 构建本身由
#                     publish.yml 的 Docker 构建覆盖，这里不重复）
#   push v* tag    -> 三平台完整打包 + 创建 GitHub Release，附上安装包
#   push ds-* tag  -> 同上。客户端曾单独走 ds-* 线，保留以便回滚老版本
#
# 只有本 workflow 创建 release；publish.yml 不再建，否则两边会抢同一个 tag。

on:
  push:
    branches: [main]
    tags: ['v*', 'ds-*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # 一次完整构建约 10 分钟。设上限是为了让"卡住"变成"失败"：macOS runner 计费
    # 是 Linux 的 10 倍，一个默认 6 小时超时的僵住 job 很贵。
    timeout-minutes: 45
    strategy:
      # 一个平台挂了也要看到其他平台的结果，否则每次只能修一个。
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS arm64
            flags: --mac --arm64
            artifact: macos-arm64
          # 必须在真 x64 机器上构建：原生模块不能跨架构打包。Next 的文件追踪只
          # 会把构建机器那一个 better-sqlite3 prebuild 打进去，所以在 arm64 上打
          # x64 得到的是塞了 arm64 二进制的包，构建全绿、装上去启动即崩
          # （已在本地实测，现在 afterPack 会直接让这种构建失败）。
          #
          # 标签是 macos-15-intel，不是 macos-13——后者已被 GitHub 下线，排队等
          # 一个永远不会出现的 runner，表现为 job 一直卡在 "Waiting for a runner"
          # 而不是报错。GitHub 已宣布 macOS 15 是最后一版 Intel 镜像，这条线以后
          # 会消失，届时要么改自托管 runner，要么放弃 Intel 包。
          - os: macos-15-intel
            label: macOS x64
            flags: --mac --x64
            artifact: macos-x64
          - os: windows-latest
            label: Windows x64
            flags: --win --x64
            artifact: windows-x64

    env:
      # 打进 app 的是 .next/standalone/node_modules 的原样拷贝。pnpm 默认的
      # isolated 布局靠 .pnpm 软链，在 Windows 上是 junction（绝对路径），拷进
      # 安装包后指向构建机器上的路径，装到用户机器上必然找不到。hoisted 布局
      # 没有链接，三个平台行为一致。
      NPM_CONFIG_NODE_LINKER: hoisted
      # 不让 electron-builder 自己去钥匙串里翻签名身份。仓库没有 Developer ID，
      # 自动发现只会让 macOS 构建随 runner 环境变化而时好时坏。
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 放在 install 之后：版本号只影响 electron-builder 生成的文件名，不影响依赖
      # 解析，先装依赖能让 --frozen-lockfile 比对的是仓库里原样的 package.json。
      - name: Align version with the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/set-version-from-tag.mjs

      - name: Type check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      # 分支推送到此为止：类型检查和测试已经跑过，那是三平台各跑一遍真正能抓到
      # 东西的部分（Windows 上的测试就抓到过 POSIX 权限位不可移植的用例）。
      - name: Build Next standalone + electron bundles
        if: startsWith(github.ref, 'refs/tags/')
        run: pnpm build:desktop

      # --publish never 是必须的：electron-builder 在 tag 上构建且环境里有
      # GH_TOKEN 时会自作主张地上传，绕开下面那个 release job 的编排。
      - name: Package installer
        if: startsWith(github.ref, 'refs/tags/')
        run: pnpm exec electron-builder --config config/electron-builder.config.cjs ${{ matrix.flags }} --publish never

      - name: Upload installer
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: jadeai-${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.exe
          # 打包"成功"但产物为空是这条流水线最容易悄悄发生的失败方式。
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts

      # 三个平台缺一个就不该发版：一个只有 macOS 包的 release 比构建失败更难发现。
      - name: Verify all three installers are present
        run: |
          set -euo pipefail
          missing=0
          for pattern in "artifacts/*mac-arm64.dmg" "artifacts/*mac-x64.dmg" "artifacts/*win-x64-setup.exe"; do
            if ! compgen -G "$pattern" > /dev/null; then
              echo "::error::missing installer matching $pattern"
              missing=1
            fi
          done
          exit $missing

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## JadeAI ${{ github.ref_name }}

            ### Web 版

            ```
            docker pull twwch/jadeai:${{ github.ref_name }}
            ```

            数据库支持 SQLite（默认，零配置）与 PostgreSQL（`DB_TYPE=postgresql`）。

            ### 桌面客户端

            | 平台 | 文件 |
            |---|---|
            | macOS (Apple Silicon) | `JadeAI-*-mac-arm64.dmg` |
            | macOS (Intel) | `JadeAI-*-mac-x64.dmg` |
            | Windows (x64) | `JadeAI-*-win-x64-setup.exe` |

            ### 首次打开

            安装包带的是 **ad-hoc 签名**（有效但匿名），没有 Apple Developer ID，
            也没有公证，所以第一次打开会被系统拦下。这是预期的。

            **macOS** —— 终端执行这一条，然后正常双击：

            ```
            xattr -dr com.apple.quarantine /Applications/JadeAI.app
            ```

            也可以走图形界面：双击被拦后打开 系统设置 → 隐私与安全性，
            在底部点"仍要打开"。

            > 注意：**不要**依赖"右键 → 打开"。macOS 15 起 Apple 移除了这个
            > 绕过方式，对未公证的应用不再生效。

            **Windows** —— SmartScreen 提示时点"更多信息" → "仍要运行"。

            ### 客户端数据存放位置

            全部在本机，不上传任何服务器。卸载不会删除，需要清空请手动删目录：

            - macOS：`~/Library/Application Support/JadeAI/`
            - Windows：`%APPDATA%\JadeAI\`

            客户端会在启动时检查新版本，右下角提示并可直接下载。这是它唯一的对外
            请求，可在 `jade-settings.json` 里设 `"updateCheckEnabled": false` 关闭。

            ---
