name: Build & Push Docker Image

# Web 版的镜像流水线。桌面客户端的安装包由 desktop-release.yml 产出，同一个
# `v*` tag 会分别触发这两个 workflow —— 各自独立跑，一边失败不影响另一边的产物。
#
# release 只由 desktop-release.yml 创建。这里不再建，否则两个 workflow 会同时
# 对同一个 tag 调 create-release，谁先谁后不确定。

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    # `ds-*` 是客户端曾经独有的 tag 线，那种 tag 不该推 Web 镜像、更不该覆盖
    # latest。上面的 `v*` 过滤已经排除了它（以 d 开头），这里是第二道闸。
    if: ${{ !startsWith(github.ref_name, 'ds-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: twwch/jadeai
          tags: |
            # main branch → main,latest
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            # tag push → v1.0.0,latest
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
