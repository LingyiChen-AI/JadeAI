name: Build & Push Docker Image

# 这是 Web 版的镜像流水线。桌面客户端走 desktop-release.yml，用 `ds-*` tag。
# 下面的 `v*` 不匹配 `ds-v0.0.1`（它以 d 开头），所以客户端发版不会打 Web 镜像。

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    # 上面的 tag 过滤已经排除了 `ds-*`，这里是第二道闸：将来若有人把过滤放宽成
    # `*`，也不会让一次客户端发版悄悄推出一个 Web 镜像并覆盖 latest。
    if: ${{ !startsWith(github.ref_name, 'ds-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: twwch/jadeai
          tags: |
            # main branch → main,latest
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            # tag push → v1.0.0,latest
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ github.event.head_commit.message }}
          generate_release_notes: false
